<!DOCTYPE html>
<html>
<head>
  <title>EmailJS Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      display: none;
    }
  </style>
</head>
<body>
  <h1>EmailJS Direct Test</h1>
  <p>This is a standalone HTML file to test EmailJS directly, bypassing Next.js.</p>
  
  <div class="form-group">
    <label>Service ID:</label>
    <input type="text" id="serviceId" placeholder="service_xxxxxxx">
  </div>
  
  <div class="form-group">
    <label>Template ID:</label>
    <input type="text" id="templateId" placeholder="template_xxxxxxx">
  </div>
  
  <div class="form-group">
    <label>Public Key:</label>
    <input type="text" id="publicKey" placeholder="xxxxxxxxxxxxxxxx">
  </div>
  
  <hr>
  
  <form id="emailForm">
    <div class="form-group">
      <label>Name:</label>
      <input type="text" name="name" value="Test User">
    </div>
    
    <div class="form-group">
      <label>Email:</label>
      <input type="email" name="email" value="test@example.com">
    </div>
    
    <div class="form-group">
      <label>Subject:</label>
      <input type="text" name="subject" value="Test Email from HTML Page">
    </div>
    
    <div class="form-group">
      <label>Message:</label>
      <textarea name="message" rows="4">This is a test message sent directly from a standalone HTML page.</textarea>
    </div>
    
    <div class="form-group">
      <label>Service Type:</label>
      <input type="text" name="serviceType" value="testing">
    </div>
    
    <button type="submit">Send Test Email</button>
  </form>
  
  <div id="result"></div>
  
  <script>
    document.getElementById('emailForm').addEventListener('submit', function(event) {
      event.preventDefault();
      
      const serviceId = document.getElementById('serviceId').value;
      const templateId = document.getElementById('templateId').value;
      const publicKey = document.getElementById('publicKey').value;
      const resultDiv = document.getElementById('result');
      
      // Validate inputs
      if (!serviceId || !templateId || !publicKey) {
        resultDiv.style.display = 'block';
        resultDiv.style.backgroundColor = '#ffdddd';
        resultDiv.innerHTML = 'Please fill in all the EmailJS credentials';
        return;
      }
      
      // Initialize EmailJS
      emailjs.init(publicKey);
      
      // Display sending message
      resultDiv.style.display = 'block';
      resultDiv.style.backgroundColor = '#ffffdd';
      resultDiv.innerHTML = 'Sending email...';
      
      // Send the email
      emailjs.sendForm(serviceId, templateId, this)
        .then(function(response) {
          console.log('SUCCESS!', response.status, response.text);
          resultDiv.style.backgroundColor = '#ddffdd';
          resultDiv.innerHTML = 'Email sent successfully! Status: ' + response.status + '<br>Response: ' + response.text;
        }, function(error) {
          console.log('FAILED...', error);
          resultDiv.style.backgroundColor = '#ffdddd';
          resultDiv.innerHTML = 'Failed to send email: ' + JSON.stringify(error);
        });
    });
  </script>
</body>
</html>
